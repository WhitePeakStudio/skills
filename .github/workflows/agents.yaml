name: Validate agent profiles
on: [push, pull_request]
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build-agents.py --check
